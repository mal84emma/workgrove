# Security baseline: keep local writes inside the selected workspace and require
# an approval before crossing the sandbox boundary. That approval is granted by a
# model, not by you: with approvals_reviewer = "auto_review" Codex reviews its own
# escalation requests and can approve them in seconds with no human prompt, so the
# sandbox boundary is a speed bump, not a consent gate. Set approvals_reviewer =
# "user" to be asked yourself.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
allow_login_shell = false

# Keep command-line network access off. Hosted search remains available through
# the lower-exposure cached search index.
web_search = "cached"

# Cache credentials in the macOS Keychain rather than a plaintext ~/.codex/auth.json.
# install.sh drops this line on Linux, where there is no Keychain to store them in.
cli_auth_credentials_store = "keyring"

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "default"

[sandbox_workspace_write]
network_access = false

# Connected apps: keep the destructive and open-world classes off entirely, and
# gate their other tools behind an approval. As above, that approval is reviewed
# by a model rather than by you; set approvals_reviewer = "user" here too to be
# asked yourself.
[apps._default]
approvals_reviewer = "auto_review"
default_tools_approval_mode = "prompt"
destructive_enabled = false
open_world_enabled = false

# Pass a reduced environment to spawned commands and automatically remove
# common secret-bearing variable names.
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.filters]
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"GITHUB_*" = "exclude"
"*TOKEN*" = "exclude"
"*SECRET*" = "exclude"
"*KEY*" = "exclude"

# Do not persist new CLI transcript history locally. Existing history is left
# untouched so that deleting it remains an explicit user decision.
[history]
persistence = "none"

# Do not export local telemetry, and never include prompt text if telemetry is
# enabled later.
[otel]
exporter = "none"
log_user_prompt = false
