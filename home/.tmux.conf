# Let cmux's relay vars reach panes started in an existing session (cmux rebinds them on every attach).
# All six, not just the socket: `cmux notify` authorises a relayed request against the SURFACE and the
# WORKSPACE it finds in the environment — not against --workspace, which it ignores. A tmux pane keeps the
# identity of whichever cmux connection started it, so after cmux reconnects the ssh row (new socket, new
# surface, new workspace) a pane carrying the old ids was refused with remote_relay_surface_denied, and
# `wt new` on a VM could never ask the Mac for a row. Measured on cmux 0.64: correcting the surface alone
# moves the refusal on to remote_relay_workspace_denied, and only the whole set is accepted.
set -ag update-environment " CMUX_SOCKET_PATH CMUX_WORKSPACE_ID CMUX_SURFACE_ID CMUX_PANEL_ID CMUX_TAB_ID CMUX_TERMINAL_LIFECYCLE_ID"

# Everything below makes Claude Code inside tmux behave as it does in a bare terminal. It targets tmux 3.2a
# (Ubuntu 22.04), so nothing here needs a newer tmux; allow-passthrough, for one, is 3.3+ and left out.

# The default, screen, has no true colour or italics. tmux-256color is in ncurses-term, which not every host
# has, and a TERM with no terminfo breaks every full-screen program in the pane, so fall back when missing.
# Only new sessions and panes pick this up; an existing pane keeps the TERM it started with.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Tell tmux what the outer terminal can do beyond its terminfo: 24-bit colour, synchronized updates and
# extended keys. The outer TERM is whatever the client arrives with — xterm-ghostty when Ghostty's terminfo is
# installed on this host, xterm-256color otherwise (a tmux client whose TERM has no local terminfo will not
# start, and Ubuntu 22.04's ncurses has no xterm-ghostty entry). Nothing here sets or forwards TERM, so do not
# narrow the xterm* glob to one of them: it matches both, and narrowing it silently loses all three features.
# sync is the one to read twice: on 3.2a it installs iTerm2's legacy DCS form, not DECSET 2026 (tmux switched
# in 3.4), and a terminal that implements only 2026 — Ghostty does — may ignore it. Harmless, and it starts
# working when the host gets tmux >= 3.4. The leading comma is not load-bearing: terminal-features is an array
# option, so cmd-set-option takes the array branch and options_array_assign splits on the separator and skips
# empty fields, appending each entry as a new array item; string concatenation applies only to non-array
# options. It is kept because it is what the tmux FAQ prints and because it is required on older tmux, where
# these were plain strings. Either way -a appends, so the built-in xterm* entry survives rather than being
# replaced.
set -as terminal-features ",xterm*:RGB:sync:extkeys"
# Programs pick their colour depth from the environment, not from tmux: under TERM=tmux-256color Claude drops
# to 256 colours unless COLORTERM says truecolor, and ssh does not carry COLORTERM over from the Mac.
set-environment -g COLORTERM truecolor
# Claude then caps itself at 256 colours anyway whenever $TMUX is set, unless this says tmux passes RGB on,
# which the terminal-features line above makes true.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# 500 ms by default: every Esc waits that long to find out whether it starts a sequence. 10 ms is enough for
# a remote link, since a sequence arrives in one packet.
set -s escape-time 10
# Pass focus in/out to the pane, so Claude knows when its row is looked at.
set -s focus-events on
# Forward modified keys like Shift+Enter to programs that ask for them, instead of dropping the modifier.
set -s extended-keys on
# Claude writes to the main screen, so scrolling back through a long session means tmux history.
set -g history-limit 50000
