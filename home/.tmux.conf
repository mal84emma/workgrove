# Let the cmux relay variables reach panes that start in an existing session. cmux rebinds them on every
# attach. Pass all six, not only the socket. `cmux notify` authorizes a relayed request against the SURFACE
# and the WORKSPACE that it finds in the environment, not against --workspace, which it ignores. A tmux pane
# keeps the identity of the cmux connection that started it. After cmux reconnects the ssh row, the row has a
# new socket, surface, and workspace. Without the whole set, cmux refused a pane that still carried the old
# ids (remote_relay_surface_denied). As a result, `wt new` on a VM could never ask the Mac for a row.
# Measured on cmux 0.64: a correct surface alone moves the refusal on to remote_relay_workspace_denied, and
# cmux accepts only the whole set.
set -ag update-environment " CMUX_SOCKET_PATH CMUX_WORKSPACE_ID CMUX_SURFACE_ID CMUX_PANEL_ID CMUX_TAB_ID CMUX_TERMINAL_LIFECYCLE_ID"

# The settings below make Claude Code in tmux behave as it does in a bare terminal. They target tmux 3.2a
# (Ubuntu 22.04), so nothing here needs a newer tmux. For example, this file leaves out allow-passthrough,
# which needs tmux 3.3+.

# The default TERM, screen, has no true color or italics. tmux-256color is in ncurses-term, which not every
# host has. A TERM with no terminfo breaks every full-screen program in the pane, so fall back when
# tmux-256color is missing. Only new sessions and panes get this setting. An existing pane keeps the TERM
# that it started with.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Tell tmux what the outer terminal can do beyond its terminfo: 24-bit color, synchronized updates, and
# extended keys. The outer TERM is the TERM that the client arrives with. It is xterm-ghostty when Ghostty's
# terminfo is installed on this host. Otherwise it is xterm-256color, because a tmux client whose TERM has no
# local terminfo will not start, and Ubuntu 22.04's ncurses has no xterm-ghostty entry. Nothing here sets or
# forwards TERM. So do not narrow the xterm* glob to one of the two: it matches both, and a narrower glob
# silently loses all three features.
# Of the three features, sync needs care. On 3.2a, sync installs iTerm2's legacy DCS form, not DECSET 2026
# (tmux switched in 3.4). A terminal that implements only 2026, as Ghostty does, may ignore that form. This is
# harmless, and sync starts to work when the host gets tmux >= 3.4.
# The leading comma has no effect here. terminal-features is an array option, so cmd-set-option takes the
# array branch. There, options_array_assign splits on the separator, skips empty fields, and appends each
# entry as a new array item. String concatenation applies only to non-array options. The comma stays
# because the tmux FAQ prints it, and because older tmux, where these were plain strings, requires it.
# In both cases -a appends, so the built-in xterm* entry survives and is not replaced.
set -as terminal-features ",xterm*:RGB:sync:extkeys"
# Programs get their color depth from the environment, not from tmux. Under TERM=tmux-256color, Claude drops
# to 256 colors unless COLORTERM says truecolor. ssh does not carry COLORTERM over from the Mac.
set-environment -g COLORTERM truecolor
# Even then, Claude caps itself at 256 colors whenever $TMUX is set, unless this variable says that tmux
# passes RGB on. The terminal-features line above makes that true.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# The default is 500 ms: every Esc waits that long to find out whether it starts a sequence. A 10 ms wait is
# enough for a remote link, because a sequence arrives in one packet.
set -s escape-time 10
# Pass focus-in and focus-out to the pane, so that Claude knows when someone looks at its row.
set -s focus-events on
# Forward modified keys such as Shift+Enter to programs that ask for them. Otherwise tmux drops the modifier.
set -s extended-keys on
# Claude writes to the main screen, so you scroll back through a long session in tmux history.
set -g history-limit 50000
# With mouse on, tmux asks the terminal for mouse events. It forwards the wheel to programs that want it
# (Claude scrolls its own view). In a plain shell, the wheel scrolls tmux history. With mouse off, cmux
# turns the wheel into Up/Down keys, which Claude reads as prompt history. Hold Shift to select text natively.
set -g mouse on
