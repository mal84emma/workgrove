# Run ShellCheck, Ruff, and every suite in test/ for pull requests and pushes to main.
# The workflow uses no secrets. Its token can only read the repository, and checkout does not
# store the token in .git/config. So the suites have no token for the GitHub API.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Keep main pushes and pull-request merge checks in separate cancellation groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install shellcheck
        # Ubuntu's bundled version is older than the ShellCheck version used here.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x bin/* lib/workgrove/*.sh lib/workgrove/vm/*.sh install.sh test/*.sh test/fakes/cmux test/fakes/*.sh home/.claude/statusline-command.sh test/fakes/pgrep test/fakes/tmux
      - name: Install Ruff
        env:
          RUFF_VERSION: 0.14.0
          RUFF_SHA256: 28fe06f700caf99eee235f90e6e349f48b7f9a4b0d42e3ee5b3686f9259649a3
        run: |
          archive="$RUNNER_TEMP/ruff.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/astral-sh/ruff/releases/download/$RUFF_VERSION/ruff-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$RUFF_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" ruff-x86_64-unknown-linux-gnu/ruff
          echo "$RUNNER_TEMP/ruff-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Check Python code
        run: |
          ruff --version
          ruff check --select F,E9 lib test

  python39:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Run Python 3.9 suites
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(sys.version_info[:2] != (3, 9))'
          bash test/run.sh test/*-smoke.sh

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # macOS has only /bin/bash 3.2. Homebrew's bash goes first on PATH, so the suites and every
      # script that they start get bash 5.
      - name: Install bash 5 and jq (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install bash jq
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # This step prints the tool versions. It stops the job in these cases:
      # - The bash on PATH is older than bash 5.
      # - jq is missing. The Ubuntu runner images include it.
      # - On Linux, tmux is missing. The Ubuntu runner images include it, and every VM has it.
      #   Without tmux, `wt rm` on a VM cannot check for a running agent, so it keeps the worktree,
      #   and wt-smoke.sh fails.
      # - On macOS, /bin/bash is bash 5 or later. In that case, no suite can test bash 3.2.
      - name: Check the tools
        run: |
          echo "bash on PATH: $(command -v bash), $(bash -c 'echo "$BASH_VERSION"')"
          echo "/bin/bash: $(/bin/bash -c 'echo "$BASH_VERSION"')"
          git --version
          python3 --version
          if ! jq --version; then
            echo '::error::jq is missing'
            exit 1
          fi
          if command -v tmux >/dev/null; then
            tmux -V
          elif [[ $RUNNER_OS == Linux ]]; then
            echo '::error::tmux is missing; install it in this workflow, as docs/new-vm.md does on a VM'
            exit 1
          else
            echo 'tmux: not installed'
          fi
          if ! bash -c '((BASH_VERSINFO[0] >= 5))'; then
            echo '::error::the bash on PATH is older than bash 5'
            exit 1
          fi
          if [[ $RUNNER_OS == macOS ]] && /bin/bash -c '((BASH_VERSINFO[0] >= 5))'; then
            echo '::error::/bin/bash is bash 5 or later, so no suite can test bash 3.2'
            exit 1
          fi

      # The shared runner discovers test/*-smoke.sh, including docs-smoke.sh.
      # It limits workers and reports scenario, task, suite, and total times.
      - name: Run the suites
        env:
          JOBS: "4"
          # install-smoke.sh runs install.sh with this bash. An empty value selects the bash on PATH.
          INSTALL_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}
          # Git in the suites can reach only local repositories.
          GIT_ALLOW_PROTOCOL: file
        run: bash test/run.sh
